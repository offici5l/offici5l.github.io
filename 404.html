<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
</head>
<body>
    <div id="content">
        <h2>404 - Page Not Found</h2>
        <p>The page you are looking for does not exist.</p>
    </div>

    <script>
        const path = window.location.pathname.replace(/\/$/, "");

        const routes = {
            "/fcetool": {
                title: "Project Moved",
                html: `
                    <h2>Project Has Moved</h2>
                    <p>fcetool has moved from <code>github.com/offici5l/fcetool</code> to <strong>github.com/fcetool</strong></p>
                    <p>Go to new location:<br><a href="https://fcetool.github.io">https://fcetool.github.io</a></p>
                `
            }
        };

        if (routes[path]) {
            document.getElementById("content").innerHTML = routes[path].html;
            document.title = routes[path].title;
        }
    </script>
</body>
</html>
