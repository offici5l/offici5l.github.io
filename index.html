<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title id="meta-title"></title>
  <meta name="description" id="meta-desc">
  <meta property="og:type" content="website">
  <meta property="og:url" id="og-url">
  <meta property="og:title" id="og-title">
  <meta property="og:description" id="og-desc">
  <meta property="og:image" id="og-image">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" id="tw-site">
  <meta name="twitter:title" id="tw-title">
  <meta name="twitter:description" id="tw-desc">
  <meta name="twitter:image" id="tw-image">
  <link rel="icon" id="link-icon" type="image/png">
  <link rel="apple-touch-icon" id="link-touch-icon">
  <link rel="canonical" id="link-canonical">
  <meta name="theme-color" id="meta-theme-color" content="#0c0c0c">
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.github.com">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script>
    (function () {
      var t = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);

      var origin = window.location.origin;
      var logo   = origin + '/' + CONFIG.logo;

      document.getElementById('meta-title').textContent = CONFIG.site_name;
      document.getElementById('meta-desc').content      = CONFIG.site_desc;
      document.getElementById('og-url').content         = origin;
      document.getElementById('og-title').content       = CONFIG.site_name;
      document.getElementById('og-desc').content        = CONFIG.site_desc;
      document.getElementById('og-image').content       = logo;
      document.getElementById('tw-site').content        = '@' + CONFIG.x;
      document.getElementById('tw-title').content       = CONFIG.site_name;
      document.getElementById('tw-desc').content        = CONFIG.site_desc;
      document.getElementById('tw-image').content       = logo;
      document.getElementById('link-icon').href         = CONFIG.logo;
      document.getElementById('link-touch-icon').href   = CONFIG.logo;
      document.getElementById('link-canonical').href    = origin;

      document.getElementById('ld-json').textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'ProfilePage',
        mainEntity: {
          '@type': 'Person',
          name: CONFIG.site_name,
          image: logo,
          sameAs: [
            'https://github.com/' + CONFIG.github,
            'https://x.com/' + CONFIG.x
          ]
        }
      });
    }());
  </script>
  <script type="application/ld+json" id="ld-json"></script>
</head>
<body>

<div class="page">
  <div class="avatar-wrap" id="avatar-wrap" role="button" tabindex="0">
    <img class="avatar" id="site-logo" src="" alt="" width="88" height="88" loading="eager" fetchpriority="high">
    <div class="avatar-ring" aria-hidden="true"></div>
  </div>

  <div class="social-links">
    <a class="social-link" id="link-telegram" href="#" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
    </a>
    <a class="social-link" id="link-x" href="#" target="_blank" rel="noopener noreferrer" aria-label="X">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </a>
    <button class="social-link contact-trigger" id="contact-trigger" aria-label="Contact">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
  </div>

  <div class="section">
    <div class="projects-grid" id="projects-list" role="list" aria-label="Projects">
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
    </div>
    <div style="display:flex;justify-content:center;">
      <a class="github-btn" id="github-all-btn" href="#" target="_blank" rel="noopener noreferrer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.87-1.54-3.87-1.54-.52-1.32-1.27-1.68-1.27-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.95.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.77.11 3.06.74.8 1.19 1.82 1.19 3.08 0 4.42-2.69 5.39-5.26 5.68.41.35.78 1.05.78 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.21.67.8.56 4.57-1.52 7.86-5.83 7.86-10.91C23.5 5.65 18.35.5 12 .5z"/></svg>
        <span id="repos-btn-text"></span>
      </a>
    </div>
  </div>

</div>

<div id="sr-alert" role="alert" aria-live="assertive" class="sr-only"></div>

<div class="modal-backdrop" id="contact-backdrop">
  <div class="modal" id="contact-modal" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
    <div class="modal-header">
      <span class="modal-title" id="contact-modal-title">Contact</span>
      <div class="modal-header-right">
        <button class="modal-close" id="contact-modal-close" aria-label="Close">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <div class="contact-email-row" id="contact-email-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <a id="contact-email-link" href="#" class="contact-email-text"></a>
        <button class="contact-copy-btn" id="contact-copy-btn" aria-label="Copy email">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
      <div class="contact-or" aria-hidden="true"><span>or</span></div>
      <div class="contact-field">
        <input type="text" id="cf-name" placeholder="Name (optional)" autocomplete="off">
      </div>
      <div class="contact-field">
        <input type="email" id="cf-email" placeholder="Email (optional)" autocomplete="off">
        <p class="contact-field-hint">Required if you're expecting a reply.</p>
      </div>
      <div class="contact-field">
        <textarea id="cf-message" placeholder="Message" rows="4"></textarea>
      </div>
      <input type="checkbox" name="botcheck" style="display:none;">
      <div class="h-captcha" data-captcha="true"></div>
      <div class="contact-footer">
        <button class="contact-btn" id="cf-submit">Send</button>
        <p id="contact-status"></p>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <div class="modal-header-right">
        <a class="modal-repo-btn" id="modal-repo-btn" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span id="modal-stars-count"></span>
          <span class="sr-only">stars</span>
        </a>
        <button class="modal-back" id="modal-back" aria-label="Back to README">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          README
        </button>
        <button class="modal-close" id="modal-close" aria-label="Close dialog">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <div class="readme" id="modal-readme"></div>
    </div>
  </div>
</div>

<script>
  window._markedReady = false;
  window._markedQueue = [];
  (function () {
    document.getElementById('site-logo').src = CONFIG.logo;
    document.getElementById('site-logo').alt = CONFIG.site_name;
    document.getElementById('github-all-btn').href = 'https://github.com/' + CONFIG.github + '?tab=repositories';
    document.getElementById('repos-btn-text').textContent = 'All repositories';
    document.getElementById('link-telegram').href = 'https://t.me/' + CONFIG.telegram;
    document.getElementById('link-x').href = 'https://x.com/' + CONFIG.x;
    if (CONFIG.blog_url) {
      var blogBtn = document.createElement('a');
      blogBtn.className = 'blog-btn';
      blogBtn.href = CONFIG.blog_url;
      blogBtn.target = '_blank';
      blogBtn.rel = 'noopener noreferrer';
      blogBtn.textContent = 'Blog';
      document.querySelector('.social-links').insertAdjacentElement('afterend', blogBtn);
    }
  }());
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js" async onload="marked.setOptions({breaks:true,gfm:true});window._markedReady=true;window._markedQueue.forEach(function(fn){fn();});window._markedQueue=[];"></script>
<script src="app.js"></script>
<script>
  if (CONFIG.cf_analytics) {
    var s = document.createElement('script');
    s.defer = true;
    s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
    s.setAttribute('data-cf-beacon', '{"token":"' + CONFIG.cf_analytics + '"}');
    document.body.appendChild(s);
  }
</script>

<script src="https://web3forms.com/client/script.js" async defer></script>
</body>
</html>
