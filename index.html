<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title id="meta-title"></title>
  <meta name="description" id="meta-desc">
  <meta property="og:type" content="website">
  <meta property="og:url" id="og-url">
  <meta property="og:title" id="og-title">
  <meta property="og:description" id="og-desc">
  <meta property="og:image" id="og-image">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" id="tw-site">
  <meta name="twitter:title" id="tw-title">
  <meta name="twitter:description" id="tw-desc">
  <meta name="twitter:image" id="tw-image">
  <link rel="icon" id="link-icon" type="image/png">
  <link rel="apple-touch-icon" id="link-touch-icon">
  <link rel="canonical" id="link-canonical">
  <meta name="theme-color" id="meta-theme-color" content="#080809">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script>
    (function () {
      var t = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);

      var origin = window.location.origin;
      var logo   = origin + '/' + CONFIG.logo;

      document.getElementById('meta-title').textContent = CONFIG.site_name;
      document.getElementById('meta-desc').content      = CONFIG.seo_desc;
      document.getElementById('og-url').content         = origin;
      document.getElementById('og-title').content       = CONFIG.site_name;
      document.getElementById('og-desc').content        = CONFIG.seo_desc;
      document.getElementById('og-image').content       = logo;
      document.getElementById('tw-site').content        = '@' + CONFIG.x;
      document.getElementById('tw-title').content       = CONFIG.site_name;
      document.getElementById('tw-desc').content        = CONFIG.seo_desc;
      document.getElementById('tw-image').content       = logo;
      document.getElementById('link-icon').href         = CONFIG.logo;
      document.getElementById('link-touch-icon').href   = CONFIG.logo;
      document.getElementById('link-canonical').href    = origin;

      document.getElementById('ld-json').textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'ProfilePage',
        mainEntity: {
          '@type': 'Person',
          name: CONFIG.site_name,
          image: logo,
          sameAs: [
            'https://github.com/' + CONFIG.github,
            'https://x.com/' + CONFIG.x
          ]
        }
      });
    }());
  </script>
  <script type="application/ld+json" id="ld-json"></script>
</head>
<body>

<div class="ambient-glow" aria-hidden="true"></div>

<main class="page-container">
  
  <header class="profile-card">
    <div class="avatar-orbit-wrap">
      <div class="avatar-wrap" id="avatar-wrap" role="button" tabindex="0" title="Toggle Theme">
        <img class="avatar" id="site-logo" src="" alt="" width="92" height="92" loading="eager" fetchpriority="high">
        <div class="orbit-ring" aria-hidden="true"></div>
      </div>
    </div>

    <div class="profile-meta">
      <p class="brand-bio" id="brand-bio">Building & shipping open-source software straight from a mobile device.</p>
    </div>
  </header>

  <nav class="social-nav" aria-label="Social Links">
    <a class="social-btn" id="link-github" href="#" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
      <span>GitHub</span>
    </a>
    <a class="social-btn" id="link-telegram" href="#" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      <span>Telegram</span>
    </a>
    <a class="social-btn" id="link-x" href="#" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      <span>X</span>
    </a>
  </nav>

  <section class="contact-card">
    <div class="card-header">
      <h2 class="card-title">Get in Touch</h2>
      <p class="card-subtitle">Send a direct message or copy official email address</p>
    </div>

    <div class="email-pill" id="contact-email-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      <a id="contact-email-link" href="#" class="email-address"></a>
      <button class="copy-action-btn" id="contact-copy-btn" aria-label="Copy email address" title="Copy Email">
        <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>

    <div class="divider"><span>OR SEND MESSAGE</span></div>

    <div class="form-grid">
      <div class="input-field-wrap">
        <input type="text" id="cf-name" placeholder="Your Name (optional)" autocomplete="off">
      </div>
      <div class="input-field-wrap">
        <input type="email" id="cf-email" placeholder="Your Email (optional)" autocomplete="off">
        <span class="field-hint">Required for response</span>
      </div>
      <div class="input-field-wrap text-area-wrap">
        <textarea id="cf-message" placeholder="Write your message..." rows="4"></textarea>
      </div>

      <input type="checkbox" name="botcheck" style="display:none;">
      <div class="h-captcha" data-captcha="true"></div>

      <div class="form-actions">
        <button class="pro-btn" id="cf-submit">
          <span>Send Message</span>
          <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <p id="contact-status" class="status-feedback" role="status"></p>
      </div>
    </div>
  </section>

</main>

<div id="sr-alert" role="alert" aria-live="assertive" class="sr-only"></div>

<script src="https://web3forms.com/client/script.js" async defer></script>
<script>
  (function () {
    document.getElementById('site-logo').src = CONFIG.logo;
    document.getElementById('site-logo').alt = CONFIG.site_name;
    if (CONFIG.site_desc) {
      document.getElementById('brand-bio').textContent = CONFIG.site_desc;
    }
    document.getElementById('link-github').href = 'https://github.com/' + CONFIG.github;
    document.getElementById('link-telegram').href = 'https://t.me/' + CONFIG.telegram;
    document.getElementById('link-x').href = 'https://x.com/' + CONFIG.x;

    if (CONFIG.blog_url) {
      var blogBtn = document.createElement('a');
      blogBtn.className = 'social-btn blog-btn';
      blogBtn.id = 'link-blog';
      blogBtn.href = CONFIG.blog_url;
      blogBtn.target = '_blank';
      blogBtn.rel = 'noopener noreferrer';
      blogBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg><span>Blog</span>';
      document.querySelector('.social-nav').appendChild(blogBtn);
    }
  }());
</script>
<script src="app.js"></script>
<script>
  if (CONFIG.cf_analytics) {
    var s = document.createElement('script');
    s.defer = true;
    s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
    s.setAttribute('data-cf-beacon', '{"token":"' + CONFIG.cf_analytics + '"}');
    document.body.appendChild(s);
  }
</script>
</body>
</html>
